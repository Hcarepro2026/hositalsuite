<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password — Hospital Suite</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
<div class="login-wrap">
  <div class="card login-card pad-lg">
    <div class="center mb">
      <div style="font-size:2.4rem">🔐</div>
      <h1 style="margin:4px 0 2px">Enter your code &amp; new password</h1>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
    {% endwith %}
    <form method="post" action="/reset-password">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <label>Username or phone number</label>
      <input type="text" name="identifier" required autocapitalize="none">
      <label>6-digit code from SMS</label>
      <input type="text" name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
             required placeholder="000000" style="letter-spacing:.4em;font-weight:800">
      <label>New password</label>
      <input type="password" name="new_password" autocomplete="new-password" required>
      <label>Repeat new password</label>
      <input type="password" name="confirm_password" autocomplete="new-password" required>
      <div class="hint">At least 8 characters with letters and numbers.</div>
      <div class="mt">
        <button class="btn big" type="submit" style="width:100%">Update my password</button>
      </div>
    </form>
    <p class="center mt"><a href="/forgot-password">Resend code</a> · <a href="/login">Sign in</a></p>
  </div>
</div>
</body>
</html>
